<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="#0C1524"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#3B82F6" stroke-width="0.5">
    <line x1="64" y1="32" x2="64" y2="224"/>
    <line x1="96" y1="32" x2="96" y2="224"/>
    <line x1="128" y1="32" x2="128" y2="224"/>
    <line x1="160" y1="32" x2="160" y2="224"/>
    <line x1="192" y1="32" x2="192" y2="224"/>
    <line x1="48" y1="80" x2="208" y2="80"/>
    <line x1="48" y1="112" x2="208" y2="112"/>
    <line x1="48" y1="144" x2="208" y2="144"/>
    <line x1="48" y1="176" x2="208" y2="176"/>
