<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#0C1524"/>
  <circle cx="256" cy="256" r="248" stroke="#1E3A5F" stroke-width="4"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#3B82F6" stroke-width="1">
    <line x1="128" y1="80" x2="128" y2="432"/>
    <line x1="192" y1="80" x2="192" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="320" y1="80" x2="320" y2="432"/>
    <line x1="384" y1="80" x2="384" y2="432"/>
    <line x1="96" y1="160" x2="416" y2="160"/>
    <line x1="96" y1="224" x2="416" y2="224"/>
    <line x1="96" y1="288" x2="416" y2="288"/>
    <line x1="96" y1="352" x2="416" y2="352"/>
  </g>

  <!-- Three stacked chevrons (roster tiers: Enterprise, Large, Medium) -->
  <!-- Top chevron (Enterprise) - amber accent -->
  <path d="M160 168 L256 120 L352 168" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Middle chevron (Large) - bright blue -->
  <path d="M136 232 L256 168 L376 232" stroke="#3B82F6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Bottom chevron (Medium) - navy with glow -->
  <path d="M112 296 L256 216 L400 296" stroke="#60A5FA" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Base platform line -->
  <line x1="128" y1="368" x2="384" y2="368" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>

  <!-- ECHELON text -->
  <text x="256" y="410" text-anchor="middle" font-family="'Geist Sans', -apple-system, sans-serif" font-size="36" font-weight="600" letter-spacing="8" fill="#F1F5F9">ECHELON</text>
</svg>
